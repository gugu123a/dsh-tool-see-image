name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  mount-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dsh into a temp checkout so the mount test can resolve every
      # @deepseek-ai package (dsh-app-boot, cordis-plugin-timer,
      # dsh-system-prompt, dsh-tools, etc.) from real node_modules.
      # shamefully-hoist: lift all transitive deps to the top-level
      # node_modules so the test's bareModuleBaseUrl resolves them directly
      # (npm's --legacy-peer-deps leaves peer deps missing, breaking the
      # loader's transitive imports). Written as a local .npmrc so it
      # definitely applies to this checkout (pnpm config set writes the user
      # scope and can be missed under a fresh HOME).
      - name: Install dsh (for @deepseek-ai packages)
        run: |
          mkdir -p /tmp/dsh-checkout
          cd /tmp/dsh-checkout
          echo "shamefully-hoist=true" > .npmrc
          pnpm init >/dev/null 2>&1 || true
          pnpm add @deepseek-ai/dsh@latest
          echo "DSH_CHECKOUT=/tmp/dsh-checkout" >> "$GITHUB_ENV"

      - name: Run mount regression test
        run: node test/mount-test.mjs
        env:
          DSH_CHECKOUT: /tmp/dsh-checkout
