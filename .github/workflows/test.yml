name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  mount-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Install dsh into a temp checkout so the mount test can resolve
      # @deepseek-ai packages from real node_modules.
      - name: Install dsh (for @deepseek-ai packages)
        run: |
          mkdir -p /tmp/dsh-checkout
          cd /tmp/dsh-checkout
          npm init -y >/dev/null
          npm install @deepseek-ai/dsh@latest @deepseek-ai/cordis-plugin-timer@latest @deepseek-ai/dsh-system-prompt@latest @deepseek-ai/dsh-tools@latest
          echo "DSH_CHECKOUT=/tmp/dsh-checkout" >> "$GITHUB_ENV"

      - name: Run mount regression test
        run: node test/mount-test.mjs
        env:
          DSH_CHECKOUT: /tmp/dsh-checkout
